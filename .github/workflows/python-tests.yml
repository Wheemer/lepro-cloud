name: Python Tests

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest and compileall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest paho-mqtt==2.1.0

      - name: Run pytest
        run: python -m pytest

      - name: Compile integration and tests
        run: python -m compileall custom_components/lepro_cloud/*.py tests
