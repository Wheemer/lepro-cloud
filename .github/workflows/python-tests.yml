name: Python Tests

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff, pytest, and compileall
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: python -m pytest

      - name: Compile integration and tests
        run: python -m compileall custom_components/lepro_cloud/*.py tests


  real-ha:
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha: ["2026.4.0", "2026.10.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated test image
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: docker build -f tests/Dockerfile.ha --build-arg "HA_VERSION=$HA_VERSION" -t lepro-test .
      - name: Run offline Home Assistant regressions
        run: |
          mkdir -p .test-output
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 -v "$GITHUB_WORKSPACE:/source:ro" -v "$GITHUB_WORKSPACE/.test-output:/audit" lepro-test /source/tests/real_ha_regressions.py
