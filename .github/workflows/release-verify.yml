name: Release Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version tag to validate and stage, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Validate and stage artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest paho-mqtt==2.1.0

      - name: Verify tag matches manifest version
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          python -c "import json, os, sys; from pathlib import Path; ref = os.environ['RELEASE_REF']; manifest = json.loads(Path('custom_components/lepro_cloud/manifest.json').read_text()); expected = f\"v{manifest['version']}\"; sys.exit(f'Ref {ref} does not match manifest version {expected}') if ref != expected else None"

      - name: Run pytest
        run: python -m pytest

      - name: Compile integration and tests
        run: python -m compileall custom_components/lepro_cloud/*.py tests

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Stage release artifact
        run: |
          mkdir -p dist
          git ls-files custom_components/lepro_cloud | zip -@ dist/lepro_cloud.zip

      - name: Upload staged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lepro-cloud-${{ inputs.ref }}
          path: dist/lepro_cloud.zip
          if-no-files-found: error
