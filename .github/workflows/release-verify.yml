name: Release Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version tag to validate and stage, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Validate and stage artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest paho-mqtt==2.1.0

      - name: Verify tag matches manifest version
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          python -c "import json, os, sys; from pathlib import Path; ref = os.environ['RELEASE_REF']; manifest = json.loads(Path('custom_components/lepro_cloud/manifest.json').read_text()); expected = f\"v{manifest['version']}\"; sys.exit(f'Ref {ref} does not match manifest version {expected}') if ref != expected else None"

      - name: Run pytest
        run: python -m pytest

      - name: Compile integration and tests
        run: python -m compileall custom_components/lepro_cloud/*.py tests

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Stage release artifact
        run: |
          mkdir -p dist
          (
            cd custom_components/lepro_cloud
            git archive --format=zip --output=../../dist/lepro_cloud.zip HEAD .
          )
          unzip -Z1 dist/lepro_cloud.zip | grep -Fx "manifest.json"
          unzip -Z1 dist/lepro_cloud.zip | grep -Fx "brand/icon.png"
          unzip -Z1 dist/lepro_cloud.zip | grep -Fx "_private/mqtt_client_key.pem"

      - name: Upload staged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lepro-cloud-${{ inputs.ref }}
          path: dist/lepro_cloud.zip
          if-no-files-found: error
