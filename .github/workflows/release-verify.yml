name: Release Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version tag to validate and stage, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Validate and stage artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --require-hashes -r requirements-test.txt

      - name: Verify tag matches manifest version
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          python -c "import json, os, sys; from pathlib import Path; ref = os.environ['RELEASE_REF']; manifest = json.loads(Path('custom_components/lepro_cloud/manifest.json').read_text()); expected = f\"v{manifest['version']}\"; sys.exit(f'Ref {ref} does not match manifest version {expected}') if ref != expected else None"

      - name: Run Ruff
        run: ruff check .

      - name: Run pytest
        run: python -m pytest

      - name: Compile integration and tests
        run: python -m compileall custom_components/lepro_cloud/*.py tests

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

      - name: Stage release artifact
        run: |
          python scripts/build_release.py dist/lepro_cloud.zip
          python -c 'import json,os,subprocess; from pathlib import Path; Path("dist/verification.json").write_text(json.dumps({"commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"ref":os.environ["RELEASE_REF"],"run_id":os.environ["GITHUB_RUN_ID"]}))'
        env:
          RELEASE_REF: ${{ inputs.ref }}

      - name: Upload staged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lepro-cloud-${{ inputs.ref }}
          path: dist/*
          if-no-files-found: error


  real-ha:
    name: Home Assistant ${{ matrix.ha }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha: ["2026.4.0", "2026.10.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Build isolated test image
        env:
          HA_VERSION: ${{ matrix.ha }}
        run: docker build -f tests/Dockerfile.ha --build-arg "HA_VERSION=$HA_VERSION" -t lepro-test .
      - name: Run offline Home Assistant regressions
        run: |
          mkdir -p .test-output
          docker run --rm --network none -e PYTHONDONTWRITEBYTECODE=1 -v "$GITHUB_WORKSPACE:/source:ro" -v "$GITHUB_WORKSPACE/.test-output:/audit" lepro-test /source/tests/real_ha_regressions.py
