name: Publish Release

on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful Release Verification run for this exact tag commit
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Validate and publish ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import json, os, sys; from pathlib import Path; version = json.loads(Path('custom_components/lepro_cloud/manifest.json').read_text())['version']; sys.exit('Tag does not match manifest version') if os.environ['RELEASE_TAG'] != f'v{version}' else None"

      - name: Download and require the exact verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: |
          gh run download "$VERIFICATION_RUN_ID" --name "lepro-cloud-$GITHUB_REF_NAME" --dir dist
          python scripts/check_verification.py
          python scripts/build_release.py dist/lepro_cloud.zip --verify-only

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/lepro_cloud.zip --title "Lepro Cloud ${{ github.ref_name }}"
