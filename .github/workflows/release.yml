name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import json, os, sys; from pathlib import Path; version = json.loads(Path('custom_components/lepro_cloud/manifest.json').read_text())['version']; sys.exit('Tag does not match manifest version') if os.environ['RELEASE_TAG'] != f'v{version}' else None"

      - name: Build integration ZIP
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/lepro_cloud.zip HEAD custom_components/lepro_cloud
          unzip -Z1 dist/lepro_cloud.zip | grep -Fx "custom_components/lepro_cloud/_private/mqtt_client_key.pem"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/lepro_cloud.zip --title "Lepro Cloud ${{ github.ref_name }}" --generate-notes
