version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: America/St_Johns
    target-branch: main
    labels:
      - dependencies
      - python
    commit-message:
      prefix: deps
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:30"
      timezone: America/St_Johns
    target-branch: main
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: deps
    open-pull-requests-limit: 10
